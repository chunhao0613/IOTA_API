# 本機開發用 broker 設定（明文 1883），搭配 docker-compose.dev.yml 使用。
#
# 為什麼需要這一份：正式的 mosquitto.conf 是 TLS-only（8883），需要
# config/certs/server.key + ca.key，而這兩支私鑰依照 .gitignore 不進版控，
# clone 下來的機器沒有。重跑 generate_certs.sh 會產生「新的 CA」並覆蓋
# 版控中的 ca.crt，導致 Arduino/MqttSmartLock 內嵌的 MQTT_ROOT_CA 失效、
# 已燒錄的實體 ESP32 連不上 broker。
#
# 因此本機開發改走明文 1883，完全不動 mosquitto.conf 與 config/certs/。
# 正式部署 / 實機測試請照 README 用原本的 docker-compose.yml（TLS）。

listener 1883 0.0.0.0
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest stdout
